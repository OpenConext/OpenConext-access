---
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - name: Yarn Audit client
        run: yarn audit --level high --groups dependencies
        working-directory: client
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: 'maven'
      - name: Set up MySQL
        uses: shogo82148/actions-setup-mysql@v1.52.1
        with:
          distribution: "mariadb"
          mysql-version: "10.6"
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "CREATE DATABASE access CHARACTER SET utf8mb4 \
          COLLATE utf8mb4_unicode_520_ci;"
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "CREATE USER 'access'@'localhost' IDENTIFIED BY 'secret';";
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "GRANT ALL privileges ON access.* TO 'access'@'localhost';"
      - name: Build with Maven
        run: mvn clean install --file pom.xml
#      - name: Codecov
#        uses: codecov/codecov-action@v6
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Generate coverage
        run: mvn -pl server test jacoco:report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: server/target/site/jacoco

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
