---
logging:
  config: classpath:/logback-spring.xml

server:
  port: 8886
  error:
    path: "/error"
    include-message: always
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: false

spring:
  main:
    banner-mode: "off"
  cache:
    type: simple
  session:
    jdbc:
      cleanup-cron: "-"
      initialize-schema: always
      flush-mode: on_save
      save-mode: on_set_attribute
    store-type: jdbc
    timeout: 8h
  mvc:
    log-request-details: false
  security:
    oauth2:
      client:
        registration:
          oidcng:
            client-id: playground_client
            client-secret: secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: "authorization_code"
            scope: openid
        provider:
          oidcng:
            authorization-uri: "https://connect.test2.surfconext.nl/oidc/authorize"
            token-uri: "https://connect.test2.surfconext.nl/oidc/token"
            user-info-uri: "https://connect.test2.surfconext.nl/oidc/userinfo"
            jwk-set-uri: "https://connect.test2.surfconext.nl/oidc/certs"
            user-name-attribute: sub
            user-info-authentication-method: client_secret_basic
  jpa:
    properties:
      hibernate:
        naming-strategy: org.hibernate.cfg.ImprovedNamingStrategy
        format_sql: false
        show_sql: false
    open-in-view: false
    show-sql: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mysql://localhost/access?autoReconnect=true&useSSL=false&permitMysqlScheme=true&allowPublicKeyRetrieval=true
    username: access
    password: secret
  flyway:
    locations: classpath:db/mysql/migration
    fail-on-missing-locations: true
  mail:
    host: localhost
    port: 1025

oidcng:
  discovery-url: "https://connect.test2.surfconext.nl/oidc/.well-known/openid-configuration"
  introspect-url: "https://connect.test2.surfconext.nl/oidc/introspect"
  resource-server-id: myconext.rs
  resource-server-secret: secret
  base-url: http://localhost:8886

cron:
  user-cleaner-cron: "PT30M"
  user-cleaner-cron-initial-delay: "PT10S"
  user-cleaner-lock-at-least-for: "PT5M"
  user-cleaner-lock-at-most-for: "PT28M"
  org-contact-reminder-days: 180
  org-delete-after-days: 365
  user-inactivity-warn-days: 60
  user-inactivity-delete-days: 90

lifecycle:
  user: lifecycle
  password: secret

jira:
  enabled: false
  base-url: "http://localhost:8081"
  user-name: "test-beheer-rpc"
  project-key: CXT
  environment: test
  api-key: secret

  # Timeout in milliseconds
  connection-timeout: 60_000

institution-admin:
  entitlement: "urn:mace:surfnet.nl:surfnet.nl:sab:role:SURFconextverantwoordelijke"
  organization-guid-prefix: "urn:mace:surfnet.nl:surfnet.nl:sab:organizationGUID:"

config:
  client-url: "http://localhost:3002"
  base-url: "test2.surfconext.nl"
  edu_id_schac_home_organization: "eduid.nl"
  surf_schac_home_organization: "surfnet.nl"
  discovery: "https://connect.test2.surfconext.nl/oidc/.well-known/openid-configuration"
  invite: "https://invite.test2.surfconext.nl"
  sram: "https://test.sram.surf.nl/"
  service_desk: "https://servicedesk.surf.nl/jira/plugins/servlet/desk/user/requests?reporter=all"
  feedback_widget_enabled: true
  test_environment: false
  identity_providers:
      - name: "SXS IdP"
        entityid: "http://mock-idp"
        descriptionEN: "A test IdP that allows you to simulate attribute sets yourself. You can find the metadata <a href='https://mujina-idp.test.surfconext.nl/metadata' target='_blank'>here</a>"
        descriptionNL: "Een test-IdP waarmee je zelf attributen-sets kunt simuleren. De metadata vind je <a href='https://mujina-idp.test.surfconext.nl/metadata' target='_blank'>hier</a>"
      - name: "SXS Dummy"
        entityid: "https://idp.diy.surfconext.nl"
        descriptionEN: "A test IdP with <a href='https://idp.diy.surfconext.nl/showusers.php' target='_blank'>fictitious user accounts</a>. You can find the metadata <a href='https://idp.diy.surfconext.nl/saml2/idp/metadata.php' target='_blank'>here</a>"
        descriptionNL: "Een test-IdP met <a href='https://idp.diy.surfconext.nl/showusers.php' target='_blank'>fictieve gebruikersaccounts</a>. De metadata vind je <a href='https://idp.diy.surfconext.nl/saml2/idp/metadata.php' target='_blank'>hier</a>"
  idp_proxy_meta_data:  https://metadata.test2.surfconext.nl/idp-metadata.xml
  minimal_stepup_acr_level: "http://test2.surfconext.nl/assurance/loa2"
  features:
    - name: idp
      enabled: true
    - name: invite
      enabled: true
    - name: sram
      enabled: true
    - name: mfa
      enabled: true
  acr_values:
    - "http://test2.surfconext.nl/assurance/loa1.5"
    - "http://test2.surfconext.nl/assurance/loa2"
    - "http://test2.surfconext.nl/assurance/loa3"

eduid-idp-entity-id: "https://login.test2.eduid.nl, https://localhost.surf.id"

super-admin:
  users:
    - "urn:collab:person:example.com:admin"

gui:
  disclaimer:
    background-color: red
    content: LOCAL

feature:
  enable-performance-seed: False
  statistics-enabled: False
  stepup-required: False

email:
  from: "no-reply@surf.nl"
  contactEmail: "access@surf.nl"
  serviceDeskEmail: "help@surfconext.nl"
  supportEmail: "support@surfconext.nl"
  jiraErrorEmail: "jira-errors@surf.nl"
  environment: "local"

# The manage section determines if an external Manage is used to integrate with, or that a predefined, static list
# of applications is loaded to populate the application dropdown in the JS forms.
# To disable the integration with an external Manage instance, set enabled to False. When enabled is False the url is
# ignored then and the different manage entities are loaded from json files in `server/src/main/resources/manage`.
# Each *.json file in this directory corresponds with the contents of that specific entity_type.
# To test the provisioning (e.g. SCIM, EVA, Graphp) with real endpoints you can set the manage.local property below to
# True and then the provisioning.local.json file is used which is not in git as it is in .gitignore. You can safely
# configure real users / passwords and test against those. See server/src/main/java/access/manage/ManageConf.java
# and server/src/main/java/access/manage/LocalManage.java to see how it works.
manage:
  enabled: True
#  enabled: False
  url: "https://manage.test2.surfconext.nl"
#  url: "http://localhost:8081"
  user: openconextaccess
  password: secret
  defaultState: testaccepted
  # If manage is disabled (e.g. enabled: False) the staticManageDirectory is the directory where the {metadata_type}.json files
  # are located. This can also be an absolute file path, e.g. file:///opt/openconext/invite/manage
  staticManageDirectory: classpath:/manage
#  staticManageDirectory: file:///usr/local/etc/manage

invite:
  enabled: True
  url: "https://invite.test2.surfconext.nl"
  user: access
  password: secret

statistics:
  enabled: True
  url: "http://localhost:8081"
  user: access
  password: secret

s3storage:
  url: http://localhost:9000
  key: "minioadmin"
  secret: "minioadmin"
  bucket: "s3-images"

ohdear:
  apiKey: "test-token"
  baseUrl: http://localhost:8089/api
  enabled: false

springdoc:
  pathsToMatch: "/api/v1/**"
  api-docs:
    path: "/ui/api-docs"
    enabled: false
  swagger-ui:
    path: "/ui/api-ui.html"
    enabled: false
    operationsSorter: method
    oauth:
      client-id: ${spring.security.oauth2.client.registration.oidcng.client-id}
      client-secret: ${spring.security.oauth2.client.registration.oidcng.client-secret}
      use-basic-authentication-with-access-code-grant: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info,mappings,metrics"
      base-path: "/internal"
  endpoint:
    info:
      access: unrestricted
    health:
      access: unrestricted
      show-details: always
    mappings:
      access: none
    metrics:
      access: none
  info:
    git:
      mode: full

# used by the git plugin
info:
  build:
    artifact: "@project.artifactId@"
    version: "@project.version@"
